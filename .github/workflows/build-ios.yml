name: Build iPhone denoiser
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 26
        run: |
          candidate=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          test -n "$candidate"
          echo "DEVELOPER_DIR=$candidate/Contents/Developer" >> "$GITHUB_ENV"
      - name: Prepare dependencies
        run: |
          brew install xcodegen autoconf automake libtool
          python3 Scripts/prepare.py
          bash Scripts/build-libraw.sh
          xcodegen generate
          pod install
      - name: Compile device app
        run: |
          set -o pipefail
          xcodebuild -workspace PhotoDenoise.xcworkspace -scheme PhotoDenoise -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee build.log
      - name: Package unsigned IPA
        run: |
          test -s build/Build/Products/Release-iphoneos/PhotoDenoise.app/raw.onnx
          test -s build/Build/Products/Release-iphoneos/PhotoDenoise.app/rgb.onnx
          test -s build/Build/Products/Release-iphoneos/PhotoDenoise.app/sony24105.json
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/PhotoDenoise.app package/Payload/
          cd package
          zip -qr ../PhotoDenoise-unsigned.ipa Payload
      - name: Build simulator and run synthetic RAW and JPEG tests
        run: |
          python3 -m venv /tmp/fixture-env
          /tmp/fixture-env/bin/pip install onnx
          /tmp/fixture-env/bin/python Scripts/make-linear-fixture.py
          xcodegen generate
          pod install
          bash Scripts/build-libraw.sh simulator
          xcodebuild -workspace PhotoDenoise.xcworkspace -scheme PhotoDenoise -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=$(uname -m) -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build > simulator-build.log 2>&1
          python3 Scripts/simulator-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoDenoise-unsigned
          path: PhotoDenoise-unsigned.ipa
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-check
          path: |
            simulator-build.log
            smoke-output/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
