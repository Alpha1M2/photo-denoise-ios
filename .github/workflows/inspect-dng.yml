name: Inspect synthetic DNG metadata
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: clang++ -std=c++17 -fobjc-arc -framework Foundation -framework ImageIO -framework CoreGraphics Scripts/test-dng-metadata.mm -o /tmp/test-dng && /tmp/test-dng
